[package]
name = "ssbu-stall-press-carry"
version = "0.2.0"
edition = "2021"
publish = false
description = "Skyline plugin for Super Smash Bros. Ultimate 13.0.5: a button press or stick flick made while an online match waits for the other console is carried into the next input record instead of being dropped"
license = "MIT"

[package.metadata.skyline]
titleid = "01006A800016E000"

[features]
# Eden-only diagnostics (chain.rs's stand-ins); never in the shipped NRO.
diag = []

[lib]
# cdylib only: Cargo skips LTO for a library that is also an rlib.
crate-type = ["cdylib"]

[target.'cfg(target_os = "switch")'.dependencies]
skyline = "=0.6.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("switch"))'] }
